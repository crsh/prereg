name: Open Stats Lab and Project TIER preregistration template (McIntyre et al., 2017)
description: Preregistration template for quantitative social sciences that tries to strike a balance between being both comprehensive and accessible for researchers at all stages of their careers, including undergraduates and/or researchers who have little past experience with the preregistration process. Based on suggestion by McIntyre et al. (2017, v1.0, doi:10.17605/OSF.IO/N39TR, v1.0)
